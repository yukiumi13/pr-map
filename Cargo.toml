[package]
name = "prmap"
version = "0.1.0-alpha.1"
edition = "2021"
description = "A PR stack minimap with live coding-agent positions"
license = "Apache-2.0"
repository = "https://github.com/yukiumi13/pr-map"
rust-version = "1.90"

[dependencies]
fancy-regex = "0.11"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
unicode-width = "0.2"
toml = "0.8"
