[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-pr-map"
version = "0.1.0a4"
description = "A PR stack map with live coding-agent positions"
requires-python = ">=3.11"
dependencies = ["textual==6.12.0", "rich==15.0.0"]
license = "Apache-2.0"

[project.scripts]
pr-map = "pr_map.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[project.urls]
Homepage = "https://github.com/yukiumi13/pr-map"
